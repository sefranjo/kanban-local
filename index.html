<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="1.0">
<title>Kanban Board</title>

<style>
:root {
  --bg-primary: #f5f7fa;
  --bg-secondary: #ffffff;
  --bg-column: #ebecf0;
  --bg-card: #ffffff;
  --text-primary: #172b4d;
  --text-secondary: #5e6c84;
  --border-color: #dddfe2;
  --accent: #0079bf;
  --accent-hover: #026aa7;
  --danger: #eb5a46;
  --shadow: 0 1px 3px rgba(0,0,0,0.12);
  --radius: 8px;
  --col-width: 300px;
}

[data-theme="dark"] {
  --bg-primary: #1a1d23;
  --bg-secondary: #25282e;
  --bg-column: #34373e;
  --bg-card: #3c3f46;
  --text-primary: #e6eaef;
  --text-secondary: #a8b0be;
  --border-color: #4a4d55;
  --accent: #5c9ce6;
  --accent-hover: #7db4f5;
  --shadow: 0 1px 4px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}

/* Top Bar */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-title { font-size: 20px; font-weight: 700; }
.topbar-version { font-size: 13px; color: var(--text-secondary); font-weight: 400; }

.search-box {
  padding: 8px 14px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  width: 260px;
  outline: none;
}

.search-box:focus { border-color: var(--accent); }

.topbar-right { display: flex; align-items: center; gap: 8px; }

.btn {
  padding: 8px 14px;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}

.btn:active { transform: scale(0.97); }

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-column); color: var(--text-primary); border: 1px solid var(--border-color); }
.btn-secondary:hover { opacity: 0.85; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: 0.9; }

/* Board */
.board {
  display: flex;
  gap: 16px;
  padding: 24px;
  overflow-x: auto;
  align-items: flex-start;
}

/* Column */
.column {
  min-width: var(--col-width);
  width: var(--col-width);
  background: var(--bg-column);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 90px);
}

.column-header {
  padding: 12px 14px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
}

.column-title {
  font-size: 15px;
  letter-spacing: 0.3px;
  font-weight: 700;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  display: flex;
  align-items: center;
}

.column-title:hover { background: rgba(0,0,0,0.06); }

.column-count {
  font-size: 12px;
  color: var(--text-secondary);
  margin-left: 4px;
}

.column-menu-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 16px;
  color: var(--text-secondary);
}

.column-menu-btn:hover { background: rgba(0,0,0,0.08); }

.column-body {
  padding: 4px 10px 10px;
  overflow-y: auto;
  flex: 1;
  min-height: 20px;
}

.column-body.drag-over { background: rgba(0,0,0,0.05); border-radius: 6px; }

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: grab;
  transition: box-shadow 0.2s, opacity 0.2s;
}

.card:hover {
  box-shadow: 0 1px 2px rgba(0,0,0,0.06), var(--shadow);
}

.card.dragging { opacity: 0.4; transform: rotate(3deg); pointer-events: none; }

.card-title { font-size: 15px; line-height: 1.5; word-break: break-word; margin-bottom: 6px; }
.card-description { font-size: 13px; line-height: 1.5; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }

.has-comments::after {
  content: '💬';
  font-size: 11px;
  float: right;
}

.card-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.2s;
}

.card:hover .card-actions { opacity: 1; }

.card-action-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 13px;
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--text-secondary);
}

.card-action-btn:hover { background: rgba(0,0,0,0.08); }

.add-card-btn {
  width: 100%;
  padding: 8px;
  border: none;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  text-align: left;
  margin-top: 4px;
}

.add-card-btn:hover { opacity: 0.7; }

/* Labels */
.card-labels { display: flex; gap: 5px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
.card-label { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 3px; letter-spacing: 0.2px; white-space: nowrap; cursor: pointer; transition: opacity 0.15s; }
.card-label:hover { opacity: 0.8; }

.label-picker-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; min-height: 32px; }
.label-pick-btn { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid transparent; cursor: pointer; transition: transform 0.1s, border-color 0.15s; flex-shrink: 0; }
.label-pick-btn:hover { transform: scale(1.15); }
.label-pick-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(92,156,230,0.25); }

[aria-label="Labels"] .form-select { margin-top: 8px; padding-right: 40px; min-height: auto !important; height: 70px !important; font-size: 12px !important; resize: vertical; max-width: 100%; overflow-x: hidden; word-break: break-all; }

#labelPickerArea { display: none; margin-bottom: 18px; }
#labelPickerArea .form-label { color: var(--text-secondary); font-size: 13px; font-weight: 600; }

/* Modals */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg-secondary);
  border-radius: 12px;
  width: 95%;
  max-width: 600px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 12px 48px rgba(0,0,0,0.3);
}

.modal-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--bg-secondary);
  z-index: 10;
  border-radius: 12px 12px 0 0;
}

.modal-header h2 { font-size: 18px; }

.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 22px;
  color: var(--text-secondary);
  padding: 0 4px;
}

.modal-body { padding: 24px; }

.form-group { margin-bottom: 18px; }

.form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }

.form-input,
.form-textarea,
.form-select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  outline: none;
}

.form-input:focus,
.form-textarea:focus,
.form-select:focus { border-color: var(--accent); }

.form-textarea { resize: vertical; min-height: 80px; }

.editor-toolbar {
  display: flex;
  gap: 2px;
  padding: 6px 8px;
  border: 1px solid var(--border-color);
  border-bottom: none;
  border-radius: var(--radius) var(--radius) 0 0;
  background: var(--bg-column);
}

.editor-toolbar button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 13px;
  padding: 4px 8px;
  border-radius: 4px;
  color: var(--text-secondary);
  transition: background 0.2s, color 0.2s;
}

.editor-toolbar button:hover {
  background: rgba(0,0,0,0.08);
  color: var(--text-primary);
}

.contenteditable-editor {
  border-radius: 0 0 var(--radius) var(--radius) !important;
  overflow-y: auto;
  min-height: 120px;
  max-height: 300px;
  white-space: pre-wrap;
}

.contenteditable-editor:empty::before {
  content: attr(data-placeholder);
  color: var(--text-secondary);
  pointer-events: none;
}

.contenteditable-editor pre {
  background: var(--bg-column);
  padding: 8px 10px;
  border-radius: 4px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 13px;
  margin: 4px 0;
}

.contenteditable-editor code {
  background: var(--bg-column);
  padding: 2px 5px;
  border-radius: 3px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 13px;
}

.contenteditable-editor ul, .contenteditable-editor ol {
  margin: 4px 0;
  padding-left: 24px;
}

.contenteditable-editor a { color: var(--accent); }

.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* Comments Section */
.comments-section { margin-top: 20px; }
.comments-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }

.comment-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; }

.comment-item {
  background: var(--bg-primary);
  border-radius: var(--radius);
  padding: 14px;
}

.comment-body { font-size: 14px; line-height: 1.5; margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
.comment-body ul, .comment-body ol { margin: 0.5em 0; padding-left: 1.8em; }
.comment-body li { margin-bottom: 0.25em; }

.comment-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-secondary); }

.comment-actions { display: flex; gap: 6px; }

/* Column context menu */
.context-menu {
  position: absolute;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  z-index: 300;
  min-width: 160px;
  padding: 4px;
}

.context-menu-item {
  display: block;
  width: 100%;
  padding: 8px 14px;
  border: none;
  background: none;
  color: var(--text-primary);
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  border-radius: 4px;
}

.context-menu-item:hover { background: rgba(0,0,0,0.06); }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

mark.search-highlight {
  background: #fef08a;
  color: inherit;
  padding: 1px 2px;
  border-radius: 3px;
}

[data-theme="dark"] mark.search-highlight {
  background: #ca8a04;
  opacity: 0.7;
}

/* Label Manager */
#labelManagerModal .modal { width: 720px; max-width: 92vw; }

.label-manager-row {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border: 1px solid var(--border-color); border-radius: var(--radius);
  margin-bottom: 8px; background: var(--bg-secondary); transition: box-shadow 0.2s, border-color 0.2s;
}
.label-manager-row:hover { border-color: var(--accent); }

/* Header row for existing labels */
.label-header-row {
  display: flex; align-items: center; gap: 8px; padding: 4px 12px 6px; margin-bottom: 4px;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); font-weight: 600;
}
.label-color-swatch {
  width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--border-color);
  flex-shrink: 0; cursor: pointer; padding: 0; overflow: hidden; transition: transform 0.1s, box-shadow 0.15s;
}
.label-color-swatch:hover { transform: scale(1.1); }
.label-color-swatch::-webkit-color-swatch-wrapper { padding: 0; }
.label-color-swatch::-webkit-color-swatch { border: none; border-radius: 50%; }
.label-color-swatch::-moz-color-swatch { border: none; border-radius: 50%; }
.label-manager-inputs { flex: 1; display: flex; gap: 8px; min-width: 0; align-items: center; }
.label-name-input, .label-alias-input {
  padding: 6px 8px; border: 1px solid var(--border-color); border-radius: 4px;
  background: var(--bg-primary); color: var(--text-primary); font-size: 13px;
  font-family: inherit; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
}
.label-name-input { width: 120px; }
.label-alias-input { flex: 1; min-width: 80px; }
.label-name-input:focus, .label-alias-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(92,156,230,0.15); }
.label-name-input::placeholder { color: var(--text-secondary); opacity: 0.6; }
.label-alias-input::placeholder { color: var(--text-secondary); opacity: 0.5; font-size: 12px; }
.label-delete-btn {
  background: none; border: 1px solid var(--border-color); color: var(--text-secondary); cursor: pointer;
  font-size: 16px; padding: 4px 8px; border-radius: 6px; flex-shrink: 0; transition: all 0.15s; min-width: 28px; text-align: center; line-height: 1;
}
.label-delete-btn:hover { color: #fff; background: var(--danger); border-color: var(--danger); }
.add-label-row { display: flex; gap: 8px; margin-top: 4px; align-items: center; }
.add-label-row .btn { flex-shrink: 0; }
.label-count-badge { font-size: 12px; color: var(--text-secondary); margin-left: auto; padding-right: 4px; }

/* Hidden file inputs */
.hidden-input { display: none; }

/* Picker modal styles */
.picker-row {
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 4px;
  font-size: 15px;
}
.picker-row:hover { background: var(--hover); }
.picker-folder .picker-label::before { content: '📁 '; }
.picker-file .picker-label::before { content: '📄 '; }
.picker-parent { color: var(--text-secondary); font-size: 13px; }

/* Drag placeholder */
.card-placeholder {
  background: rgba(0,0,0,0.1);
  border-radius: var(--radius);
  margin-bottom: 8px;
  min-height: 44px;
  border: 2px dashed var(--border-color);
}

[data-theme="dark"] .card-placeholder {
  background: rgba(255,255,255,0.05);
  border-color: #5c6170;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #32383f;
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--radius);
  font-size: 14px;
  z-index: 999;
  transition: transform 0.3s ease;
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* Empty state */
.empty-column { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 13px; }

@media (max-width: 900px) {
  .topbar { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
  .search-box { width: 100%; order: -1; }
  .board { flex-direction: column; align-items: stretch; padding: 12px; overflow-x: visible; gap: 12px; }
  .column { min-width: unset; width: 100%; max-height: none; }
}

@media (max-width: 600px) {
  .topbar-left, .topbar-right { flex-wrap: wrap; justify-content: center; }
  .modal { width: calc(100% - 24px); max-height: 95vh; margin: 8px; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">Kanban Board</span>
<span class="topbar-version">v1.0</span>
    <input type="text" id="searchBox" class="search-box" placeholder="Search tasks... (Ctrl+K)">
  </div>
  <div class="topbar-right">
    <button class="btn btn-secondary" onclick="newDatabase()">New</button>
    <button class="btn btn-secondary" onclick="openExistingDatabase()">Open .sqlite</button>
    <button class="btn btn-primary" onclick="exportDatabase()">Save .sqlite</button>
    <input type="file" id="importFileInput" class="hidden-input" accept=".sqlite,.db" onchange="handleImport(event)">
    <button class="btn btn-secondary" id="themeToggle" onclick="toggleTheme()" title="Toggle theme (Ctrl+T)">🌙</button>
    <button class="btn btn-secondary" onclick="openLabelManager()" title="Manage labels">&#x1F3A8;</button>
  </div>
</div>

<!-- Database Setup Dialog (shown on first load) -->
<div class="modal-overlay active" id="setupDialog">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <h2>Kanban Board</h2>
    </div>
    <div class="modal-body" style="text-align:center; padding-top:16px;">
      <p style="color:var(--text-secondary); margin-bottom:8px;">Choose a database to start with:</p>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="createNewDatabase().catch(e => console.error('createNewDatabase:', e))" style="min-width:160px;">Create new database</button>
        <button class="btn btn-secondary" onclick="openExistingDatabase().catch(e => console.error('openExistingDatabase:', e))" style="min-width:160px;">Open existing .sqlite</button>
      </div>
    </div>
  </div>
</div>

<!-- Restore from buffer — removed (no longer used) -->


<!-- Server file picker modal -->
<div class="modal-overlay" id="serverFilePickerModal">
  <div class="modal" style="max-width:500px; max-height:70vh;">
    <div class="modal-header">
      <h2 id="pickerTitle">Select .sqlite file</h2>
      <button class="modal-close" onclick="closeServerFilePicker()" >&times;</button>
    </div>
    <div class="modal-body" style="display:flex; flex-direction:column;">
      <!-- Path input -->
      <div class="form-group" style="margin-bottom:10px;">
        <input type="text" id="pickerPathInput" class="form-input" placeholder="/home/user/kanban.sqlite">
      </div>
      
      <!-- Breadcrumb + button row -->
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
        <span id="pickerBreadcrumb" style="color:var(--text-secondary); font-size:14px;"></span>
        <button class="btn btn-secondary btn-sm" onclick="closeServerFilePicker()">Cancel</button>
      </div>

      <!-- File list (scrollable) -->
      <div id="pickerList" style="flex:1; overflow-y:auto; border:1px solid var(--border); padding:4px 8px;">
        <p style="color:var(--text-secondary)">Loading...</p>
      </div>

      <!-- Footer buttons (Save mode only) -->
      <div id="pickerSaveBtns" style="display:none; margin-top:10px; text-align:right;">
        <button class="btn btn-primary" onclick="confirmPicker()">Open / Save as...</button>
      </div>
    </div>
  </div>
</div>

<!-- Board -->
<div class="board" id="board"></div>

<!-- Add/Edit Task Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="taskModalTitle">New Task</h2>
      <button class="modal-close" onclick="closeTaskModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="taskId">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" id="taskTitleInput" class="form-input" placeholder="Task title">
      </div>
      <div class="form-group">
        <label class="form-label">Display Name (optional)</label>
        <input type="text" id="taskDisplayNameInput" class="form-input" placeholder="How this task appears on the card">
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select id="taskTypeSelect" class="form-select"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Column</label>
        <select id="taskColumnSelect" class="form-select"></select>
      </div>
      <div class="form-group" style="margin-bottom:6px;">
        <label class="form-label" for="taskLabelPills">Labels</label>
        <input type="hidden" id="taskCardLabels">
        <div id="taskLabelPills" class="label-picker-row"></div>
      </div>
      <input type="hidden" id="addTaskParentId">
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
      <button class="btn btn-danger" id="deleteTaskBtn" onclick="deleteTaskFromModal()" style="display:none">Delete</button>
      <button class="btn btn-primary" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<!-- Task Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Edit Task Details</h2>
      <button class="modal-close" onclick="closeDetailModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="detailTaskId">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" id="detailTitle" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Display Name (optional)</label>
        <input type="text" id="detailDisplayNameInput" class="form-input" placeholder="How this task appears on the card">
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select id="detailTaskTypeSelect" class="form-select"></select>
      </div>
      <div class="form-group" style="margin-bottom:18px;">
        <label class="form-label" for="detailLabelPills">Labels</label>

async function seedLabelsIfMissing() {

    } catch(e) {} // no DB or table yet — proceed with defaults
    
    // No existing labels in this DB: use server-side default labels.

async function loadLabelPrefs() {

    const result = db.exec("SELECT value FROM labels_prefs WHERE key = 'kanban_labels'");

    return JSON.parse(result[0].values[0][0]);
  } catch(_) { return null; }
}

function saveLabelPrefs(presets) {
  try {
    if (!db) return; // no DB yet — will persist once opened

    db.run("CREATE TABLE IF NOT EXISTS labels_prefs (key TEXT PRIMARY KEY, value TEXT NOT NULL DEFAULT '')");
    db.run("INSERT OR REPLACE INTO labels_prefs (key, value) VALUES (?, ?)", ['kanban_labels', JSON.stringify(presets)]);

async function syncLabelsToDb() {
  if (!db) return;
  try {
    const stored = await loadLabelPrefs();
    if (!stored || !stored.length) { saveLabelPrefs(LABEL_PRESETS); return; }

    // Detect changes between stored and current label presets.
    // Challenge: deletions cause subsequent items to shift indices, which can look like renames.
    // Heuristic for structural shifts: when old name vanished from its index but a DIFFERENT entry
    // at that same CURRENT index has the SAME color — items shifted down because something above was deleted.

    const renameMap = {};
    for (let i = 0; i < Math.min(stored.length, LABEL_PRESETS.length); i++) {
      if (stored[i].name === LABEL_PRESETS[i].name) continue; // no change at this position
      const oldName = stored[i].name;

      // Only check when the old name truly vanished from the entire current set
      if (LABEL_PRESETS.find(p => p.name === oldName)) continue;

      // Check: does another item in CURRENT share the same color as stored[i]?
      // If yes → this item likely just shifted down after a deletion above it. Skip.
      const otherEntries = LABEL_PRESETS.filter(
        (p, idx) => idx !== i && p.color === stored[i].color
      );
      if (otherEntries.length > 0) {
        continue; // structural shift from earlier deletion
      }

      renameMap[oldName] = LABEL_PRESETS[i].name; // genuine rename attempt
    }

    // Labels genuinely removed (exist in stored but nowhere in current)
    const deletedLabels = [];
    for (const item of stored) {
      if (!LABEL_PRESETS.find(p => p.name === item.name)) {
        deletedLabels.push(item.name);
      }
    }

    // New items beyond stored length (additions or re-added old names).
    // Mark them with null to avoid trying to find an old-name match.
    for (let i = stored.length; i < LABEL_PRESETS.length; i++) {
      const curName = LABEL_PRESETS[i].name;
      if (!renameMap[curName]) {
        renameMap[curName] = null; // not a rename of anything existing
      }
    }

    // Update task card_labels in DB
    const tasks = db.exec("SELECT id, card_labels FROM tasks WHERE card_labels IS NOT NULL AND card_labels != ''");
    if (tasks.length === 0) { saveLabelPrefs(LABEL_PRESETS); return; }

    let updatedCount = 0;
    for (const row of tasks[0].values) {
      const taskId = row[0];
      const labelsStr = typeof row[1] === 'string' ? row[1] : '';
      if (!labelsStr.trim()) continue;
      let newLabels = labelsStr.split(',').map(s => s.trim()).filter(Boolean);

      // Apply renames (oldName -> newName)
      for (const [oldName, newName] of Object.entries(renameMap)) {
        const idx = newLabels.indexOf(oldName);
        if (idx !== -1 && newName) {
          newLabels[idx] = newName;
        }
      }

      // Remove deleted labels
      for (const del of deletedLabels) {
        newLabels = newLabels.filter(l => l !== del);
      }

      const newStr = newLabels.join(', ');
      if (newStr !== labelsStr) {
        db.run("UPDATE tasks SET card_labels = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ?", [newStr, taskId]);
        updatedCount++;
      }
    }

    saveLabelPrefs(LABEL_PRESETS);

    if (updatedCount > 0) {
      console.log('Updated ' + updatedCount + ' task label references.');
    } else {
      console.log('Labels synced to DB. Task cards will reflect changes on re-render.');
    }

    autoSave();   // persist changes back to disk when applicable
  } catch(e) {
    console.error('syncLabelsToDb error:', e);
    saveLabelPrefs(LABEL_PRESETS);
   }
}

function initNewDB() {
  db = new SQL.Database();
  try {
    db.run("CREATE TABLE columns (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL, sort_order INTEGER NOT NULL DEFAULT 0)");
    db.run("CREATE TABLE tasks (id INTEGER PRIMARY KEY AUTOINCREMENT, column_id INTEGER NOT NULL REFERENCES columns(id), title TEXT NOT NULL, description TEXT DEFAULT '', task_type TEXT DEFAULT 'task' CHECK(task_type IN ('epic', 'task')), parent_id INTEGER REFERENCES tasks(id) ON DELETE SET NULL, card_labels TEXT DEFAULT '', sort_order INTEGER NOT NULL DEFAULT 0, created_at DATETIME DEFAULT CURRENT_TIMESTAMP, updated_at DATETIME DEFAULT CURRENT_TIMESTAMP)");
    db.run("CREATE TABLE comments (id INTEGER PRIMARY KEY AUTOINCREMENT, task_id INTEGER NOT NULL REFERENCES tasks(id) ON DELETE CASCADE, body TEXT NOT NULL, created_at DATETIME DEFAULT CURRENT_TIMESTAMP)");

    // Seed default columns using dynamic IDs to avoid collisions on partially-initialized databases.
    db.run("INSERT INTO columns (id, title, sort_order) SELECT COALESCE(MAX(id), 0) + 1, 'To Do', 0 FROM columns");
    db.run("INSERT INTO columns (id, title, sort_order) SELECT COALESCE(MAX(id), 0) + 1, 'Blocked', 1 FROM columns");
    db.run("INSERT INTO columns (id, title, sort_order) SELECT COALESCE(MAX(id), 0) + 1, 'In Progress', 2 FROM columns");
    db.run("INSERT INTO columns (id, title, sort_order) SELECT COALESCE(MAX(id), 0) + 1, 'Done', 3 FROM columns");

    seedLabelsIfMissing();
    renderBoard();

  } catch (e) {
    console.error('initNewDB failed:', e);
    throw e;
  }
}
let savedFileHandle = null; // FileHandle from showSaveFilePicker, set once after create/open
async function saveToFile() {
  if (!savedFileHandle) return false;
  try {
    const writable = await savedFileHandle.createWritable();
    await writable.write(getDBBytes());
    await writable.close();
    showToast('Saved to ' + savedFileHandle.name);
    return true;
  } catch (e) {
    console.error('[saveToFile] Failed:', e);
    showToast('Failed to save: ' + e.message);
    savedFileHandle = null; // clear so future saves don't keep failing
    return false;
  }
}

// Simple path utilities (Node's 'path' module doesn't exist in browsers)
function pathBasename(p) { return p.split('/').filter(Boolean).pop(); }
function pathDirname(p) { const parts = p.split('/'); parts.pop(); return parts.join('/') || '/'; }

let savedFilePath = null; // Set via POST /api/setup-save or open/save flow

async function autoSave() {
  if (savedFileHandle) return saveToFile();
  if (!savedFilePath) return false; // no target set yet — wait for user to pick one
  return saveViaServer();
}

async function fetchJson(url, options = {}) {
  return fetch(url, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
    redirect: 'manual'
  }).catch(e => { console.error('[fetch]', e.message); throw e; });
}

async function saveViaServer() {
  if (!savedFilePath) return false; // no path set yet
  try {
    const bytes = getDBBytes();
    const b64 = arrayBufferToBase64(bytes);
    
    console.log('[saveViaServer] saving', bytes.length, 'bytes to', savedFilePath);
    const res = await fetchJson('/api/save-db', {
      method: 'POST',
      headers: { 'X-Target-Path': savedFilePath },
      body: JSON.stringify({ data: b64 })
    });
    const result = await res.json();
    
    if (res.status === 200) {
      showToast('Saved to disk');
      console.log('[saveViaServer] OK, wrote ' + result.bytesWritten + ' bytes');
      return true;
    } else {
      console.error('[saveViaServer] API error:', result);
      throw new Error(result.error || 'Save failed (server returned ' + res.status + ')');
    }
  } catch (e) {
    console.error('[saveViaServer] Failed to save via server:', e.message);
    showToast('Auto-save to disk failed: ' + (e.message.slice(0, 60)));
    return false;
  }
}

async function openDatabaseViaServer(filePath) {
  try {
    console.log('[openDatabaseViaServer] Opening', filePath);
    const res = await fetchJson('/api/open-file', {
      method: 'POST',
      headers: { 'X-Target-Path': filePath },
      body: JSON.stringify({ path: filePath })
    });
    
    if (res.status !== 200) {
      const errText = await res.text();
      throw new Error(errText.slice(0, 128));
    }

    // Read response bytes directly into SQL.Database
    const buf = new Uint8Array(await res.arrayBuffer());

    db = new SQL.Database(buf);
    await seedLabelsIfMissing();
    renderBoard();
    
    // Establish the write target so subsequent autoSave calls use server endpoint
    return setupSaveTarget(filePath)
      .then(ok => { if (!ok) throw new Error('Unable to establish save path'); })
      .then(() => true);
  } catch (e) {
    console.error('[openDatabaseViaServer] Failed:', e.message);
    showToast('Failed to open file: ' + e.message.slice(0, 80));
    return false;
  }
}

async function setupSaveTarget(filePath) {
  try {
    const res = await fetchJson('/api/setup-save', {
      method: 'POST',
      headers: { 'X-Target-Path': filePath },
      body: JSON.stringify({ path: filePath })
    });
    if (res.status !== 200) {
      console.error('[setupSaveTarget] API error:', res);
      return false;
    }
    const result = await res.json();
    savedFilePath = result.path || filePath;
    showToast('Auto-save enabled for ' + pathBasename(savedFilePath));
    return true;
  } catch (e) {
    console.error('[setupSaveTarget] Failed:', e.message);
    showToast('Unable to establish auto-save: ' + e.message.slice(0, 80));
    return false;
  }
}

// ========== DB HELPERS ==========
function getDBBytes() {
  return new Uint8Array(db.export());
}

function arrayBufferToBase64(buffer) {
  var bytes = new Uint8Array(buffer);
  var binary = '';
  for (var i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

function newDatabase() {
  if (!confirm('Create a new database? All current data will be lost unless saved to .sqlite first.')) return;
  try {
    createNewDatabase();
  } catch (e) {
    console.error('Failed to create new database:', e);
    showToast('Error creating database.');
  }
}

async function openDatabaseSetup() {
  const dialog = document.getElementById('setupDialog');
  if (!dialog) return;
  await seedLabelsIfMissing();
}

function hideSetupDialog() {
  const dialog = document.getElementById('setupDialog');
  if (dialog) {
    dialog.classList.remove('active');
  }
}

async function createNewDatabase() {
  initNewDB();
  
  try {
    if ('showSaveFilePicker' in window) {
      const handle = await showSaveFilePicker({
        suggestedName: 'kanban_' + new Date().toISOString().slice(0, 10) + '.sqlite',
        types: [{
          description: 'SQLite Database',
          accept: { 'application/x-sqlite3': ['.sqlite'] }
        }]
      });
      savedFileHandle = handle;
      await saveToFile();
    } else if ('showOpenFilePicker' in window) {
      // FSA read-only: create DB, prompt for location, then download (can't auto-save to arbitrary path).
      showServerFilePicker('save-new')
        .then(() => exportDatabase())
        .catch(() => {});
      hideSetupDialog();
      return;
    } else {
      // No FSA at all — use server file picker for a proper save.
      await showServerFilePicker('save-new');
      hideSetupDialog();
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return; // user cancelled
    console.error('Failed to create database file:', e.message || e);
    showToast('Failed to save database: ' + e.message?.slice(0, 128));
    hideSetupDialog();
    return;
  }

  if (!savedFileHandle) {
    console.error('saveToFile completed but savedFileHandle is null');
    showToast('Error saving database. Please try again.');
    hideSetupDialog();
    return;
  }
  
  hideSetupDialog();
}

async function openExistingDatabase() {
  const hasFSA = typeof showSaveFilePicker === 'function' || typeof showOpenFilePicker === 'function';

  if (hasFSA) {
    // FSA is available — use the file picker (works only on HTTPS).
    try {
      const [handle] = await showOpenFilePicker({
        types: [{
          description: 'SQLite Database',
          accept: { 'application/x-sqlite3': ['.sqlite'] }
        }]
      });
      savedFileHandle = handle;
      const buf = new Uint8Array(await handle.getFile().arrayBuffer());

      db = new SQL.Database(buf);
      await seedLabelsIfMissing();
      renderBoard();

      showToast('Database loaded!');
    } catch (pickerErr) {
      if (pickerErr?.name === 'AbortError') return;
      console.error('[openDB] FSA picker failed:', pickerErr.message || pickerErr);
      showToast('Unable to open file via File API.');
    }
  } else {
    // No FSA at all — use Node.js server for reading (works over HTTP).
    await showServerFilePicker('open');
  }
}

function exportDatabase() {
  const bytes = getDBBytes();
  const blob = new Blob([bytes], { type: 'application/x-sqlite3' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = savedFileHandle ? savedFileHandle.name : 'kanban_' + new Date().toISOString().slice(0, 10) + '.sqlite';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Database exported!');

  // Establish FSA handle so future auto-saves can write back
  if ('showSaveFilePicker' in window && !savedFileHandle) {
    showSaveFilePicker({
      suggestedName: a.download,
      types: [{ description: 'SQLite Database', accept: { 'application/x-sqlite3': ['.sqlite'] } }]
    }).then(handle => {
      savedFileHandle = handle;
      showToast('Auto-save enabled for ' + handle.name);
    }).catch(() => {});
  }
}
function importDatabase() {
  if (!confirm('This will replace your current browser database with the imported file. Continue?')) return;

  // If FSA is available, use it directly for a better experience
  if ('showOpenFilePicker' in window) {
    document.getElementById('importFileInput').click();
    return; // wait for handleImport to fire
  }

  showServerFilePicker('open')
    .then(() => {
      // hideSetupDialog is called in handleImport's success path, or here if picker was used directly.
      setTimeout(hideSetupDialog, 50);
    })
    .catch(() => showToast('Unable to open file picker.'));
}

async function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function (e) {
    try {
       const buf = new Uint8Array(e.target.result);
       db = new SQL.Database(buf);
       await seedLabelsIfMissing();
       renderBoard();

       // Try to establish FSA handle for auto-save (works on HTTPS).
       if ('showSaveFilePicker' in window) {
         try {
           const handle = await showSaveFilePicker({
             suggestedName: file.name,
             types: [{
               description: 'SQLite Database',
               accept: { 'application/x-sqlite3': ['.sqlite'] }
             }]
           });
           savedFileHandle = handle;
           showToast('Auto-save enabled for ' + savedFileHandle.name);
         } catch (saErr) {
           // FSA save failed — this is HTTP context.
           console.error('[handleImport] showSaveFilePicker failed:', saErr.message || saErr);
           const isHttps = location.protocol === 'https:';
           if (!isHttps) {
             showToast('Auto-save unavailable (HTTP). Use "Save .sqlite" after each session.');
           } else {
             showToast('Unable to open file for writing. Use "Save .sqlite" after each session.');
           }
         }
       } else {
         // No FSA at all — HTTP context, auto-save unavailable via client APIs.
        const isHttps = location.protocol === 'https:';
        if (!isHttps) {
          showToast('Auto-save unavailable (HTTP). Use "Save .sqlite" after each session.');
        } else {
          showToast('File API not available — use "Save .sqlite" after each session.');
        }
      }

      hideSetupDialog();
      event.target.value = '';
    } catch (err) {
      console.error('[handleImport] Error loading database:', err);
      showToast('Error loading database file.');
      hideSetupDialog();
      event.target.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}

// ========== SERVER-BASED FILE PICKER (replaces FSA on HTTP) ==========
let _pickerMode = 'open'; // 'open' or 'save-new'
let _pickerCurrentDir = '';

async function showServerFilePicker(mode, suggestedPath) {
  const modal = document.getElementById('serverFilePickerModal');
  const title = document.getElementById('pickerTitle');
  const pathInput = document.getElementById('pickerPathInput');
  const listEl = document.getElementById('pickerList');
  const saveBtns = document.getElementById('pickerSaveBtns');

  _pickerMode = mode;

  if (mode === 'open') {
    title.textContent = 'Select .sqlite file';
    try { 
      const r2 = await fetchJson('/api/list?path=');
      _pickerCurrentDir = (await r2.json()).path || '/';
    } catch(_) {}
    pathInput.value = (_pickerCurrentDir === '/' ? '' : _pickerCurrentDir);
  } else { // save-new
    title.textContent = 'Save new database as...';
    const today = new Date().toISOString().slice(0, 10);
    try { 
      const r2 = await fetchJson('/api/list?path=');
      _pickerCurrentDir = (await r2.json()).path || '/';
    } catch(_) {}
    pathInput.value = _pickerCurrentDir.replace(/\/+$/, '') + '/kanban_' + today + '.sqlite';
  }

  saveBtns.style.display = (mode === 'open') ? 'none' : 'block';
  modal.classList.add('active');
  
  renderPickerList(_pickerCurrentDir);
  return true; // signal that the picker was shown and confirmed via confirmPicker() callback flow
}

function closeServerFilePicker() {
  document.getElementById('serverFilePickerModal').classList.remove('active');
}

async function renderPickerList(dirPath) {
  _pickerCurrentDir = dirPath;
  const listEl = document.getElementById('pickerList');
  try {
    // Normalize: empty means home dir, otherwise prepend leading slash if missing
    let apiPath = encodeURIComponent(dirPath || '');
    if (apiPath && !dirPath.startsWith('/')) apiPath = encodeURIComponent('/' + dirPath);
    
    const res = await fetchJson('/api/list?path=' + apiPath);
    const data = await res.json();

    if (!res.ok) {
      listEl.innerHTML = '<p style="color:red; padding:12px;">Error: ' + escapeHtml(data.error || 'unknown') + '</p>';
      return;
    }

    let html = '';

    // "Go up" row (except at root)
    if (dirPath && dirPath !== '/') {
      const parent = dirPath.replace(/\/+$/, '').replace(/\/[^\/]+$/, '');
      html += '<div class="picker-row picker-parent" data-path="' + escapeHtml(parent) + '" onclick="navigatePicker(\'..\')"><span>⬆ Parent</span></div>';
    }

    // List entries sorted: dirs first, then files
    const dirs = [];
    const files = [];
    for (const e of data.entries || []) {
      if (e.isDirectory) dirs.push(e.name);
      else files.push(e.name);
    }

    const sortedDirs = dirs.sort();
    const sortedFiles = files.filter(f => /\.sqlite$|\.db$/i.test(f)).sort();

    for (const d of sortedDirs) {
      html += '<div class="picker-row picker-folder" data-path="' + escapeHtml(d) + '" onclick="navigatePicker(\'' + escapeHtml(d).replace(/'/g, "\\'") + '\')"><span>📁 ' + escapeHtml(d) + '</span></div>';
    }

    for (const f of sortedFiles) {
      html += '<div class="picker-row picker-file" data-filename="' + escapeHtml(f) + '" onclick="selectPickerFile(\'' + escapeHtml(f).replace(/'/g, "\\'") + '\')"><span>📄 ' + escapeHtml(f) + '</span></div>';
    }

    if (!html) {
      html = '<p style="color:var(--text-secondary); padding:12px;">No .sqlite files found.</p>';
    }

    listEl.innerHTML = html;
  } catch (e) {
    listEl.innerHTML = '<p style="color:red; padding:12px;">Cannot reach server — ' + escapeHtml(e.message.slice(0, 60)) + '</p>';
  }
}

function navigatePicker(dirName) {
  const input = document.getElementById('pickerPathInput');
  
  if (dirName === '..') {
    // Navigate up: remove the last segment from the current directory path.
    let p = _pickerCurrentDir.replace(/\/+$/, '');
    let parts = p.split('/').filter(Boolean);
    parts.pop();
    _pickerCurrentDir = '/' + parts.join('/') || '/';
  } else {
    // Navigate into a folder: append to the current directory path.
    if (_pickerCurrentDir && !_pickerCurrentDir.endsWith('/')) {
      _pickerCurrentDir += '/' + dirName;
    } else {
      _pickerCurrentDir = '/' + dirName;
    }
  }

  input.value = _pickerCurrentDir === '/' ? '' : _pickerCurrentDir.replace(/\/+$/, '');
  renderPickerList(_pickerCurrentDir);
}

function selectPickerFile(fileName) {
  const input = document.getElementById('pickerPathInput');
  // Build the full file path from _pickerCurrentDir (the true directory context).
  let dirPart = (_pickerCurrentDir === '/' ? '' : _pickerCurrentDir);
  if (dirPart && !dirPart.endsWith('/')) dirPart += '/';
  input.value = dirPart + fileName;

  // In save-new mode, the user may navigate again after selecting a file.
  // Keep _pickerCurrentDir pointing to the directory, not the selected file.
  if (_pickerMode === 'save-new') {
    let base = _pickerCurrentDir.replace(/\/+$/, '');
    const lastSlash = base.lastIndexOf('/');
    _pickerCurrentDir = lastSlash >= 0 ? base.substring(0, lastSlash + 1) : '/';
  }

  confirmPicker(); // auto-confirm when selecting from list
}

function confirmPicker() {
  const input = document.getElementById('pickerPathInput');
  let filePath = (input.value || '').trim();

  if (!filePath) {
    showToast('Please enter a file path.');
    return;
  }

  // If the user just selected/typed a directory without filename, add default name
  if (!/\.(sqlite|db)$/i.test(filePath)) {
    const today = new Date().toISOString().slice(0, 10);
    filePath += '/kanban_' + today + '.sqlite';
  }

  // Ensure it looks like a valid POSIX path with filename
  if (!/^\//.test(filePath) && !filePath.startsWith('~')) {
    filePath = '/' + filePath.replace(/^\.?\/+/, '');
  }

  closeServerFilePicker();

  if (_pickerMode === 'open') {
    return openDatabaseViaServer(filePath)
      .then(success => success || showToast('Opening failed — use "Open .sqlite" to try again.'))
      .catch(e => {
        console.error('[confirmPicker] Open failed:', e.message);
        showToast('Opening failed — ' + e.message.slice(0, 80));
      })
      .finally(() => hideSetupDialog());
  } else { // save-new — create fresh DB with default schema & labels
    try {
      initNewDB();

      return setupSaveTarget(filePath)
        .then(ok => { if (!ok) throw new Error('Setup failed'); })
        .then(() => autoSave())
        .then(() => showToast('Database created!'))
        .finally(hideSetupDialog);
    } catch (e) {
      console.error('[confirmPicker] Save-new failed:', e.message);
      hideSetupDialog();
      showToast('Failed to create database: ' + e.message.slice(0, 80));
    }
  }
}

// ========== RENDERING ==========
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  const columnsResult = db.exec("SELECT * FROM columns ORDER BY sort_order");
  if (columnsResult.length === 0) return;
  const columns = mapRows(columnsResult[0]);

  const search = document.getElementById('searchBox').value.toLowerCase().trim();

  for (const col of columns) {
    const columnEl = createColumnElement(col, search);
    board.appendChild(columnEl);
  }
}

function createColumnElement(col, filter = '') {
  const columnDiv = document.createElement('div');
  columnDiv.className = 'column';
  columnDiv.dataset.columnId = col.id;

  let query = "SELECT * FROM tasks WHERE column_id = ? ORDER BY sort_order";
  let result = db.exec(query, [col.id]);
  const allTasks = [];
  if (result.length > 0) {
    allTasks.push(...mapRows(result[0]));
  }
  const totalTaskCount = allTasks.length;
  // Filter by title OR description (display_name is shown on card but filter uses canonical fields)
  const tasks = filter ? allTasks.filter(t => (t.title || '').toLowerCase().includes(filter) || (t.description || '').toLowerCase().includes(filter)) : allTasks;

  // Batch comment count query instead of N+1 per-card queries
  const taskIdSet = allTasks.map(t => t.id);
  let commentMap = {};
  if (taskIdSet.length > 0) {
    const placeholders = taskIdSet.map(() => '?').join(',');
    try {
      const cntResult = db.exec(`SELECT task_id, COUNT(*) as c FROM comments WHERE task_id IN (${placeholders}) GROUP BY task_id`, taskIdSet);
      if (cntResult.length > 0) {
        const rows = mapRows(cntResult[0]);
        for (const r of rows) commentMap[r.task_id] = r.c;
      }
    } catch(e) {}
  }

  const titleEditable = document.createElement('span');
  titleEditable.className = 'column-title';
  const visibleCount = filter ? tasks.length : totalTaskCount;
  titleEditable.innerHTML = escapeHtml(col.title) + '<span class="column-count"> (' + visibleCount + ')</span>';
  titleEditable.onclick = () => renameColumn(col.id);

  columnDiv.innerHTML = `
    <div class="column-header">
      <span></span>
      <button class="column-menu-btn" onclick="showColumnMenu(event, ${col.id})" title="Column options">&#x22EE;</button>
    </div>`;

  const headerEl = columnDiv.querySelector('.column-header');
  headerEl.insertBefore(titleEditable, headerEl.firstChild);

  const body = document.createElement('div');
  body.className = 'column-body';
  body.dataset.columnId = col.id;

  body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('drag-over'); });
  body.addEventListener('dragleave', () => { body.classList.remove('drag-over'); });
  body.addEventListener('drop', e => handleDrop(e, parseInt(body.dataset.columnId)));

  if (tasks.length === 0 && !filter) {
    const empty = document.createElement('div');
    empty.className = 'empty-column';
    empty.textContent = 'No tasks yet';
    body.appendChild(empty);
  }

  for (const task of tasks) {
    body.appendChild(createCardElement(task, col.id, commentMap, filter));
  }

  columnDiv.appendChild(body);

  const addBtn = document.createElement('button');
  addBtn.className = 'add-card-btn';
  addBtn.textContent = '+ Add a card';
  addBtn.onclick = () => openAddTask(col.id);
  columnDiv.appendChild(addBtn);

  return columnDiv;
}

function createCardElement(task, colId, commentMap = {}, search = '') {
  const div = document.createElement('div');
  let cardClass = 'card';
  div.draggable = true;
  div.dataset.taskId = task.id;
  div.dataset.columnId = task.column_id || colId;

  if (commentMap[task.id] > 0) cardClass += ' has-comments';
  div.className = cardClass;

  // Epic badge + child count
  let typeIcon = '';
  if (task.task_type === 'epic') {
    try {
      const childResult = db.exec("SELECT COUNT(*) AS c FROM tasks WHERE parent_id = ?", [task.id]);
      const childCount = childResult.length > 0 ? childResult[0].values[0][0] : 0;
      typeIcon += `<span style="float:right;color:var(--text-secondary);font-size:12px;">📁 (${childCount})</span>`;
    } catch(e) {
      typeIcon = '<span style="float:right;color:var(--text-secondary);font-size:12px;">📁</span>';
    }
  }
  // Linked indicators (left of title)
  let linkedIcons = '';
  if (task.parent_id) linkedIcons += '⛓ ';

  const escapedTitle = escapeHtml(task.title || '');
  let displayTitle = escapedTitle;
  if (task.display_name && task.display_name.trim()) {
    const dname = escapeHtml(task.display_name);
    displayTitle = search && dname.toLowerCase().includes(search)
      ? highlightSearch(dname, search)
      : dname;
  } else if (search && escapedTitle) {
    const regex = new RegExp('(' + search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    displayTitle = escapedTitle.replace(regex, '<mark class="search-highlight">$1</mark>');
  }

  let html = renderCardLabels(task.card_labels || '', search);
    html += `<div class="card-title">${typeIcon}${linkedIcons}${displayTitle}</div>`;
  if (task.description) {
    const plainDesc = task.description.replace(/<[^>]*>/g, '');
    let descText = escapeHtml(plainDesc);
    if (search) descText = highlightSearch(plainDesc, search);
    html += `<div class="card-description" title="${escapeHtml(plainDesc)}">${descText}</div>`;
  }
  html += `
    <div class="card-actions">
      <button class="card-action-btn" onclick="openDetail(${task.id})" title="Edit details & comments">✏️</button>
      ${task.task_type === 'epic' ? `<button class="card-action-btn" onclick="openAddTask(null, ${task.id})" title="Add child task">+</button>` : ''}
      <button class="card-action-btn" onclick="quickDelete(${task.id})" title="Delete">&times;</button>
    </div>`;

  div.innerHTML = html;

  div.addEventListener('dragstart', e => {
    draggedCardId = task.id;
    draggedFromColumn = parseInt(div.dataset.columnId);
    setTimeout(() => div.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  });

  div.addEventListener('dragend', () => {
    div.classList.remove('dragging');
    document.querySelectorAll('.column-body').forEach(b => b.classList.remove('drag-over'));
    draggedCardId = null;
    draggedFromColumn = null;
    dropTargetCardId = null;
  });

  return div;
}

function mapRows(result) {
  const cols = result.columns;
  return result.values.map(v => {
    const o = {};
    for (let i = 0; i < cols.length; i++) o[cols[i]] = v[i];
    return o;
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sanitizeHtml(html) {
  if (!html) return '';
  // Remove all <script> elements and their content (handles unclosed tags via the standalone pass).
  html = html.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gi, '');
  html = html.replace(/<script\b[^>]*/gi, '');
  // Strip event handler attributes: onclick, onerror, onload, onmouseover, etc.
  html = html.replace(/\s+on\w+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '');
  // Neutralize javascript: URLs in href / src / action and any other attribute.
  html = html.replace(/(href|src|action)\s*=\s*["']?\s*javascript:/gi, '$1="invalid"');
  return html;
}

function getLabelColor(name) {
  const preset = LABEL_PRESETS.find(l => l.name === name);
  return preset ? preset.color : '#95a5a6';
}

function getLabelDisplayName(name) {
  const preset = LABEL_PRESETS.find(l => l.name === name);
  if (!preset) return name.charAt(0).toUpperCase() + name.slice(1);
  return preset.alias && preset.alias.trim() ? preset.alias : name.charAt(0).toUpperCase() + name.slice(1);
}

function renderCardLabels(labelsStr, searchQuery) {
  if (!labelsStr || !labelsStr.trim()) return '';
  const labels = labelsStr.split(',').map(s => s.trim()).filter(Boolean);
  let html = '<div class="card-labels">';
  for (const name of labels) {
    const color = getLabelColor(name);
    const displayName = getLabelDisplayName(name);
    const searchMatch = searchQuery && (displayName.toLowerCase().includes(searchQuery) || name.toLowerCase().includes(searchQuery));
    if (searchMatch) {
      const regex = new RegExp('(' + searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      html += '<span class="card-label" style="background:' + color + ';color:#fff;" title="' + escapeHtml(name) + '">' + displayName.replace(regex, '<mark class="search-highlight">$1</mark>') + '</span>';
    } else {
      html += '<span class="card-label" style="background:' + color + ';color:#fff;" title="' + escapeHtml(name) + '">' + displayName + '</span>';
    }
  }
  html += '</div>';
  return html;
}

function renderLabelPicker(containerId, inputId, selectedLabelsStr) {
  const container = document.getElementById(containerId);
  if (!container || !LABEL_PRESETS.length) return '';
  const selected = (selectedLabelsStr || '').split(',').map(s => s.trim()).filter(Boolean);
  let html = '';
  for (const preset of LABEL_PRESETS) {
    const isSelected = selected.includes(preset.name);
    html += '<button type="button" class="label-pick-btn' + (isSelected ? ' selected' : '') + '" style="background:' + preset.color + ';color:#fff;" data-label="' + preset.name + '" title="' + getLabelDisplayName(preset.name) + '"' + (isSelected ? ' aria-pressed="true"' : '') + '></button>';
  }
  container.innerHTML = html;

  for (const btn of container.querySelectorAll('.label-pick-btn')) {
    const name = btn.dataset.label;
    const isSelected = selected.includes(name);
    if (isSelected) {
      btn.classList.add('selected');
      btn.setAttribute('aria-pressed', 'true');
    } else {
      btn.classList.remove('selected');
      btn.removeAttribute('aria-pressed');
    }

    // Click handler to toggle label on/off
    (function(btnEl, lbl) {
      btnEl.onclick = function(e) {
        e.stopPropagation();
        const inp = document.getElementById(inputId);
        if (!inp) return;
        const currentSel = inp.value || '';
        let labels = currentSel.split(',').map(s => s.trim()).filter(Boolean);
        if (labels.includes(lbl)) {
          labels = labels.filter(l => l !== lbl);
          btnEl.classList.remove('selected');
          btnEl.removeAttribute('aria-pressed');
        } else {
          labels.push(lbl);
          btnEl.classList.add('selected');
          btnEl.setAttribute('aria-pressed', 'true');
        }
        inp.value = labels.join(', ');
      };
    })(btn, name);
  }
}

function clearLabelPicker(containerId) {
  const container = document.getElementById(containerId);
  if (container) container.innerHTML = '';
}

function highlightSearch(text, query) {
  if (!query || !text) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(regex, '<mark class="search-highlight">$1</mark>');
}

// ========== DRAG & DROP ==========
let dropTargetCardId = null;

document.addEventListener('dragover', function(e) {
  if (draggedCardId === null) return;
  const card = e.target.closest('.card');
  if (card) {
    dropTargetCardId = parseInt(card.dataset.taskId);
    e.dataTransfer.dropEffect = 'move';
  } else {
    dropTargetCardId = null;
  }
});

function handleDrop(e, targetColumnId) {
  e.preventDefault();
  document.querySelectorAll('.column-body').forEach(b => b.classList.remove('drag-over'));

  if (draggedCardId === null) return;
  const sourceColumnId = draggedFromColumn != null ? draggedFromColumn : targetColumnId;

  try {
    // Determine sort_order based on drop position within the column body
    let newSortOrder;
    if (dropTargetCardId && parseInt(dropTargetCardId) !== draggedCardId) {
      const targetResult = db.exec("SELECT * FROM tasks WHERE id = ?", [dropTargetCardId]);
      if (targetResult.length > 0) {
        const targetTask = mapRows(targetResult[0])[0];
        // Check if drop is below or above the target card by comparing mouse Y to card center
        const targetEl = document.querySelector('.card[data-task-id="' + dropTargetCardId + '"]');
        const bodyRect = e.currentTarget.getBoundingClientRect();
        const targetRect = targetEl.getBoundingClientRect();
        const targetMid = (targetRect.top - bodyRect.top) + targetRect.height / 2;
        if (e.clientY - bodyRect.top > targetMid) {
          // Drop after target card
          newSortOrder = targetTask.sort_order + 0.5;
        } else {
          // Drop before target card
          newSortOrder = targetTask.sort_order - 0.5;
        }
      } else {
        const maxO = db.exec("SELECT COALESCE(MAX(sort_order), -1) AS m FROM tasks WHERE column_id = ?", [targetColumnId]);
        newSortOrder = ((maxO[0] ? maxO[0].values[0][0] : 0) + 1);
      }
    } else {
      // Dropped on empty area or self — append to end
      const maxO = db.exec("SELECT COALESCE(MAX(sort_order), -1) AS m FROM tasks WHERE column_id = ?", [targetColumnId]);
      newSortOrder = ((maxO[0] ? maxO[0].values[0][0] : 0) + 1);
    }

    if (sourceColumnId !== targetColumnId) {
      db.run("UPDATE tasks SET column_id = ?, sort_order = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ?", [targetColumnId, newSortOrder, draggedCardId]);
    } else {
      db.run("UPDATE tasks SET sort_order = ? WHERE id = ?", [newSortOrder, draggedCardId]);
    }

    autoSave();
    renderBoard();
  } catch (err) {
    console.error('Drop error:', err);
  }
}

function deleteTaskCascade(taskId) {
  try {
    db.run("DELETE FROM comments WHERE task_id = ?", [taskId]);
    const kids = db.exec("SELECT id FROM tasks WHERE parent_id = ?", [taskId]);
    if (kids.length > 0) {
      for (const k of mapRows(kids[0])) {
        deleteTaskCascade(k.id);
      }
    }
    db.run("DELETE FROM tasks WHERE id = ?", [taskId]);
  } catch(e) {}
}

function openAddTask(columnId, parentId) {

function saveTask() {
  const id = document.getElementById('taskId').value;
  const title = document.getElementById('taskTitleInput').value.trim();
  const colId = parseInt(document.getElementById('taskColumnSelect').value);
  const taskType = document.getElementById('taskTypeSelect').value || 'task';

    const labels = (document.getElementById('taskCardLabels').value || '').split(',').map(s => s.trim()).filter(Boolean).join(',');

  if (!title) { showToast('Title is required.'); return; }

  try {
    const displayName = (document.getElementById('taskDisplayNameInput') && document.getElementById('taskDisplayNameInput').value || '').trim();
    if (id) {
      db.run("UPDATE tasks SET title = ?, display_name = ?, column_id = ?, task_type = ?, card_labels = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ?", [title, displayName || null, colId, taskType, labels, parseInt(id)]);
    } else {
      try { db.run("ALTER TABLE tasks ADD COLUMN display_name TEXT DEFAULT ''"); } catch(_) {} // idempotent migration
      const parentId = document.getElementById('addTaskParentId').value;
      const maxOrder = db.exec("SELECT COALESCE(MAX(sort_order), -1) AS m FROM tasks WHERE column_id = ?", [colId]);
      const nextOrder = (maxOrder[0] ? maxOrder[0].values[0][0] : 0) + 1;
      if (parentId && parseInt(parentId)) {
        db.run('INSERT INTO tasks (column_id, title, display_name, task_type, parent_id, card_labels, sort_order) VALUES (?, ?, ?, ?, ?, ?, ?)', [colId, title, displayName || null, taskType, parseInt(parentId), labels, nextOrder]);
      } else {
        db.run('INSERT INTO tasks (column_id, title, display_name, task_type, card_labels, sort_order) VALUES (?, ?, ?, ?, ?, ?)', [colId, title, displayName || null, taskType, labels, nextOrder]);
      }
    }

    autoSave();
    savingTask = true;
    closeTaskModal();
    renderBoard();
    showToast(id ? 'Task updated!' : 'Task created!');
  } catch (err) {
    console.error(err);
    showToast('Error saving task.');
  } finally {
    savingTask = false;
  }
}

function deleteTaskFromModal() {
  const id = document.getElementById('taskId').value;
  if (!id || !confirm('Delete this task?')) return;
  quickDelete(parseInt(id));
}

function quickDelete(taskId) {
  if (!confirm('Delete this task?')) return;

  // Cascade: delete child comments and all descendants recursively
  try {
    const childrenResult = db.exec("SELECT id FROM tasks WHERE parent_id = ?", [taskId]);
    if (childrenResult.length > 0) {
      const children = mapRows(childrenResult[0]);
      for (const child of children) {
        deleteTaskCascade(child.id);
      }
    }
  } catch(e) {}

  db.run("DELETE FROM tasks WHERE id = ?", [taskId]);
  autoSave();
  renderBoard();
  showToast('Task deleted.');
}

function execCmd(command, value) {
  // Find whichever contenteditable currently has focus (description or comment editor)
  let target = null;
  document.querySelectorAll('.contenteditable-editor').forEach(el => {
    if (document.activeElement === el || el.contains(document.activeElement)) {
      target = el;
    }
  });

  document.execCommand(command, false, value || null);

  // Restore focus to the editor that was active when the toolbar button was clicked
  if (target) target.focus();
}

// Sanitize pasted HTML to strip <script>, event handlers, and javascript: URLs
document.addEventListener('paste', function(e) {
  if (!document.activeElement || !document.activeElement.classList.contains('contenteditable-editor')) return;
  let raw = (e.clipboardData || window.clipboardData).getData('text/html');
  if (!raw) {
    // Fallback to plain text when no HTML is available (e.g., pasting a plain URL)
    raw = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (raw) {
      e.preventDefault();
      document.execCommand('insertText', false, raw);
      return;
    }
    return;
  }
  e.preventDefault();
  const clean = sanitizeHtml(raw);
  document.execCommand('insertHTML', false, clean);
});

function getParentName(parentId) {

function renderLinkedTasks(task) {
  const section = document.getElementById('linkedTasksSection');
  let html = '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border-color);">';
  html += '<h3 style="font-size:14px;font-weight:700;margin-bottom:8px;">Linked Tasks</h3>';

  // Parent section
  const parentId = task.parent_id;
  if (parentId) {
    const parentTitle = escapeHtml(getParentName(parentId));
    html += `<div style="margin-bottom:10px;font-size:13px;display:flex;align-items:center;gap:6px;">
      <span style="color:var(--text-secondary);">Parent:</span>
      <a href="#" onclick="openDetail(${parentId}); return false;" style="cursor:pointer;color:var(--accent);">${parentTitle}</a>
      <button class="card-action-btn" onclick="unlinkParentTask()" title="Remove parent">&times;</button>
    </div>`;
  } else {
    // Show dropdown to select parent (all tasks except this one and its descendants)
    html += '<div style="margin-bottom:10px;font-size:13px;display:flex;align-items:center;gap:6px;">';
    html += '<span style="color:var(--text-secondary);">Parent:</span>';
    try {
      const allResult = db.exec("SELECT id, title FROM tasks WHERE id != ?", [task.id]);
      if (allResult.length > 0) {
        // Collect all descendant IDs to prevent circular references
        let excludeIds = ',' + task.id + ',';
        (function collectDescendants(parentId) {
          try {
            const res = db.exec("SELECT id FROM tasks WHERE parent_id = ?", [parentId]);
            if (res.length > 0) {
              for (const c of mapRows(res[0])) {
                excludeIds += c.id + ',';
                collectDescendants(c.id);
              }
            }
          } catch(e) {}
        })(task.id);

        html += `<select id="parentTaskSelect" style="flex:1;padding:4px 6px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--bg-primary);color:var(--text-primary);font-size:12px;" onchange="setParentTask(this.value)">`;
        html += '<option value="">None</option>';
        const allTasks = mapRows(allResult[0]);
        for (const t of allTasks) {
          if (!excludeIds.includes(',' + t.id + ',')) {
            html += '<option value="' + t.id + '">' + escapeHtml(t.title).slice(0, 50) + '</option>';
          }
        }
        html += '</select>';
      } else {
        html += '<span style="color:var(--text-secondary);font-style:italic;">No other tasks available</span>';
      }
    } catch(e) {
      html += '<span style="color:var(--text-secondary);">Error loading parent tasks</span>';
    }
    html += '</div>';
  }

  // Children section
  try {
    const childResult = db.exec("SELECT * FROM tasks WHERE parent_id = ? ORDER BY sort_order", [task.id]);
    if (childResult.length > 0) {
      const children = mapRows(childResult[0]);
      html += '<div style="margin-top:8px;"><div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px;">Child Tasks:</div>';
      for (const child of children) {
        html += `<div style="margin-bottom:3px;font-size:13px;display:flex;align-items:center;gap:6px;">
          <a href="#" onclick="openDetail(${child.id}); return false;" style="cursor:pointer;color:var(--accent);text-decoration:none;">${escapeHtml(child.title)}</a>
        </div>`;
      }
      // Add child button only for epic or non-ephemeral tasks
      html += '</div>';
    } else {
      if (task.task_type === 'epic') {
        html += '<div style="margin-top:8px;font-size:12px;color:var(--text-secondary);">No child tasks yet. Click + on this card to add one.</div>';
      }
    }
  } catch(e) {}

  // Add child button for epic cards
  if (task.task_type === 'epic') {
    html += `<button class="btn btn-secondary" style="margin-top:8px;padding:4px 10px;font-size:12px;" onclick="openAddTask(${parseInt(document.getElementById('detailTaskId').value)}, ${task.id}); closeDetailModal();">+ Add Child Task</button>`;
  }

  html += '</div>';
  section.innerHTML = html;
}

function setParentTask(value) {
  const taskId = parseInt(document.getElementById('detailTaskId').value);
  if (!value || !parseInt(value)) {
    db.run("UPDATE tasks SET parent_id = NULL WHERE id = ?", [taskId]);
  } else {
    // Prevent circular references: check that the new parent doesn't already have this task as an ancestor
    const targetId = parseInt(value);
    try {
      let currentParent = targetId;
      let isCircular = false;
      while (currentParent) {
        const res = db.exec("SELECT parent_id FROM tasks WHERE id = ?", [currentParent]);
        if (res.length === 0 || !res[0].values[0][0]) break;
        currentParent = res[0].values[0][0];
        if (currentParent === taskId) { isCircular = true; break; }
      }
      if (isCircular) { showToast('Cannot create circular reference'); return; }
    } catch(e) {}

    db.run("UPDATE tasks SET parent_id = ? WHERE id = ?", [targetId, taskId]);
  }
  autoSave();
  const taskResult = db.exec("SELECT * FROM tasks WHERE id = ?", [taskId]);
  if (taskResult.length > 0) renderLinkedTasks(mapRows(taskResult[0])[0]);
  renderBoard();
}

function unlinkParentTask() {
  const taskId = parseInt(document.getElementById('detailTaskId').value);
  db.run("UPDATE tasks SET parent_id = NULL WHERE id = ?", [taskId]);
  autoSave();
  const taskResult = db.exec("SELECT * FROM tasks WHERE id = ?", [taskId]);
  if (taskResult.length > 0) renderLinkedTasks(mapRows(taskResult[0])[0]);
  renderBoard();
}

  try {
    const result = db.exec("SELECT * FROM comments WHERE task_id = ? ORDER BY created_at ASC", [taskId]);

    for (const c of comments) {
      const div = document.createElement('div');
      div.className = 'comment-item';
      div.dataset.commentId = c.id;

      const date = new Date(c.created_at).toLocaleString();

          <div class="editor-toolbar"></div>

      } else {
        bodyHtml = '<div class="comment-body">' + sanitizeHtml(c.body) + '</div>';
      }

      div.innerHTML = `
        ${bodyHtml}

          <span>${date}</span>

function renderComments(taskId) {
  try {
    const result = db.exec("SELECT * FROM comments WHERE task_id = ? ORDER BY created_at ASC", [taskId]);

      document.getElementById('commentList').innerHTML = '<p style="color:var(--text-secondary);font-size:13px;">No comments yet.</p>';

    loadComments(taskId);

function editComment(commentId, taskId) {

function loadCommentsWithEditFlag(taskId, editId) {

function deleteComment(commentId, taskId) {

// ========== COLUMN MENU & RENAME ==========
function showColumnMenu(e, colId) {
  e.stopPropagation();
  // Remove existing menus
  document.querySelectorAll('.context-menu').forEach(m => m.remove());

  const menu = document.createElement('div');
  menu.className = 'context-menu';
  menu.innerHTML = `
    <button class="context-menu-item" onclick="renameColumn(${colId})">Rename</button>
    <button class="context-menu-item" onclick="moveColumn(${colId}, -1)">Move Left</button>
    <button class="context-menu-item" onclick="moveColumn(${colId}, 1)">Move Right</button>
    <button class="context-menu-item" style="color:var(--danger)" onclick="deleteColumn(${colId})">Delete Column</button>`;

  document.body.appendChild(menu);

  // Position with viewport boundary check
  const rect = e.target.getBoundingClientRect();
  let top = rect.bottom + 4;
  let left = rect.left;
  requestAnimationFrame(() => {
    const menuRect = menu.getBoundingClientRect();
    if (top + menuRect.height > window.innerHeight) {
      top = rect.top - menuRect.height - 4;
    }
    if (left + menuRect.width > window.innerWidth) {
      left = window.innerWidth - menuRect.width - 8;
    }
    menu.style.top = top + 'px';
    menu.style.left = left + 'px';
    menu.style.right = '';
  });

  function closeMenu() {
    menu.remove();
    document.removeEventListener('click', closeMenu);
  }
  // Attach handler immediately — use .closest() to avoid closing when clicking inside the menu
  document.addEventListener('click', function handler(ev) {
    if (!ev.target.closest('.context-menu')) {
      closeMenu();
    }
  });
}

function renameColumn(colId) {
  try {
    const result = db.exec("SELECT * FROM columns WHERE id = ?", [colId]);
    if (result.length === 0) return;
    const col = mapRows(result[0])[0];

    const newTitle = prompt('Rename column:', col.title);
    if (!newTitle || !newTitle.trim()) return;

    // Validate: reject characters that could break HTML display or SQL parsing.
    if (/<|>|`/.test(newTitle.trim())) {
      showToast('Invalid name.');
      return;
    }

    db.run("UPDATE columns SET title = ? WHERE id = ?", [newTitle.trim(), colId]);
    autoSave();
    renderBoard();
  } catch (err) { console.error(err); }
}

function moveColumn(colId, direction) {
  try {
    const result = db.exec("SELECT * FROM columns ORDER BY sort_order");
    if (result.length === 0) return;
    let cols = mapRows(result[0]);
    const idx = cols.findIndex(c => c.id === colId);
    if (idx < 0) return;

    const swapIdx = idx + direction;
    if (swapIdx < 0 || swapIdx >= cols.length) return;

    // Swap sort_order values
    const tmp = cols[idx].sort_order;
    db.run("UPDATE columns SET sort_order = ? WHERE id = ?", [cols[swapIdx].sort_order, colId]);
    db.run("UPDATE columns SET sort_order = ? WHERE id = ?", [tmp, cols[swapIdx].id]);

    autoSave();
    renderBoard();
  } catch (err) { console.error(err); }
}

function deleteColumn(colId) {
  if (!confirm('Delete this column and all its tasks?')) return;
  colId = parseInt(colId);

  try {
    // Get task IDs first to build a safe IN list
    const result = db.exec("SELECT id FROM tasks WHERE column_id = ?", [colId]);
    const taskIds = result.length > 0 ? mapRows(result[0]).map(t => t.id) : [];

    for (const tid of taskIds) {
      db.run("DELETE FROM comments WHERE task_id = ?", [tid]);
      db.run("DELETE FROM tasks WHERE id = ?", [tid]);
    }
    db.run("DELETE FROM columns WHERE id = ?", [colId]);

    autoSave();
    renderBoard();
  } catch (err) {
    console.error('Delete column failed:', err);
  }
}

}

// ========== MODALS ==========
function openModal(id) {
  document.getElementById(id).classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function closeTaskModal() {
  const titleInput = document.getElementById('taskTitleInput');
  if (!savingTask && titleInput && titleInput.value.trim()) {
    if (!confirm('Discard unsaved changes?')) return;
  }
  closeModal('taskModal');
}

function closeDetailModal() {
  if (savingDetails) return;
  const detailTitle = document.getElementById('detailTitle');
  const detailDesc = document.getElementById('detailDesc');
  const hasUnsaved = detailTitle.value.trim() !== _detailOrigTitle || detailDesc.textContent.trim() !== _detailOrigDesc;
  if (hasUnsaved && !confirm('Discard unsaved changes?')) return;
  closeModal('detailModal');
}

// Close modals on overlay click with unsaved check
document.addEventListener('click', e => {
  const target = e.target;
  // Ignore clicks inside any interactive element or modal content
  if (target.matches('input, textarea, button, select') || target.closest('.modal-body')) return;
  const overlay = target.closest('.modal-overlay.active');
  if (!overlay) return;
    // Don't close the setup dialog via overlay click — it has its own lifecycle
  if (target.id === 'setupDialog' || target.closest('#setupDialog') || overlay.querySelector('#setupDialog')) return;

  // Don't prompt when a save just completed — the close was already handled
  if (savingTask || savingDetails) return;
  const hasUnsaved = document.getElementById('detailTitle')?.value.trim() !== _detailOrigTitle ||
                     document.getElementById('taskTitleInput')?.value.trim();
  if (hasUnsaved && !confirm('Discard unsaved changes?')) return;
  overlay.classList.remove('active');
});

// ========== THEME (per-session, not persisted) ==========
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
}

// Auto-detect system preference on load.
if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('themeToggle').textContent = '☀️';
}

// ========== TOAST ==========
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ========== SEARCH ==========
document.addEventListener('DOMContentLoaded', () => {
  let debounceTimer;
  document.getElementById('searchBox').addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => renderBoard(), 250);
  });
  // Populate all editor toolbars from the shared constant
  populateToolbar();
});

// ========== KEYBOARD SHORTCUTS ==========
document.addEventListener('keydown', e => {
  // Ctrl+K: focus search
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchBox').focus();
  }
  // Ctrl+T: toggle theme
  if ((e.ctrlKey || e.metaKey) && e.key === 't') {
    e.preventDefault();
    toggleTheme();
  }
  // Enter in task title input saves the task (instead of just adding a newline that does nothing here)
  if (e.key === 'Enter' && !e.shiftKey) {
    const titleInput = document.getElementById('taskTitleInput');
    if (document.activeElement === titleInput) {
      e.preventDefault();
      saveTask();
    }
  }
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
    document.querySelectorAll('.context-menu').forEach(m => m.remove());
    if (commentEditorOpen) cancelCommentEditor();
    const searchBox = document.getElementById('searchBox');
    if (document.activeElement === searchBox && searchBox.value) {
      searchBox.value = '';
      renderBoard();
    }
  }
});

// ========== START ==========
init();
</script>
</body>
</html>
